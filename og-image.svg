<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, Arial, sans-serif">
  <rect width="1200" height="630" fill="#06090f"/>
  <rect width="1200" height="630" fill="url(#g)"/>
  <defs>
    <radialGradient id="g" cx="22%" cy="0%" r="90%">
      <stop offset="0" stop-color="#0f2a22"/><stop offset="1" stop-color="#06090f"/>
    </radialGradient>
  </defs>
  <!-- hairline grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <line x1="0" y1="525" x2="1200" y2="525"/><line x1="80" y1="0" x2="80" y2="630"/>
  </g>
  <!-- logo mark -->
  <g transform="translate(80,80)">
    <rect width="64" height="64" rx="16" fill="#18d68f"/>
    <g transform="translate(20,20) scale(1)" fill="none" stroke="#04130d" stroke-width="2" stroke-linejoin="round">
      <path d="M12 5.6 18.4 10.3 16 17.8 8 17.8 5.6 10.3Z"/>
    </g>
    <g transform="translate(20,20)" fill="#04130d">
      <circle cx="12" cy="5.6" r="1.8"/><circle cx="18.4" cy="10.3" r="1.8"/><circle cx="16" cy="17.8" r="1.8"/><circle cx="8" cy="17.8" r="1.8"/><circle cx="5.6" cy="10.3" r="1.8"/><circle cx="12" cy="12" r="1.5"/>
    </g>
    <text x="84" y="44" font-size="36" font-weight="800" fill="#f3f6fb" letter-spacing="-1">CupIQ</text>
  </g>
  <!-- headline -->
  <text x="80" y="300" font-size="72" font-weight="800" fill="#f3f6fb" letter-spacing="-2">Advanced World Cup 2026 stats</text>
  <text x="80" y="372" font-size="40" font-weight="600" fill="#aeb9cc">20+ metrics for all 48 teams. Stats, not predictions.</text>
  <!-- stat chips -->
  <g font-family="'JetBrains Mono', monospace" font-size="26" fill="#18d68f">
    <g transform="translate(80,440)"><rect width="150" height="56" rx="10" fill="#0b1018" stroke="#18d68f" stroke-opacity="0.4"/><text x="24" y="37">xG · xGA</text></g>
    <g transform="translate(250,440)"><rect width="160" height="56" rx="10" fill="#0b1018" stroke="#ffffff" stroke-opacity="0.1"/><text x="24" y="37" fill="#aeb9cc">net xG</text></g>
    <g transform="translate(430,440)"><rect width="190" height="56" rx="10" fill="#0b1018" stroke="#ffffff" stroke-opacity="0.1"/><text x="24" y="37" fill="#aeb9cc">PPDA · build-up</text></g>
  </g>
  <text x="80" y="585" font-family="'JetBrains Mono', monospace" font-size="22" fill="#7b8799">cupiq.app</text>
</svg>
