<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unlock CupIQ Pro</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<style>
  :root{--canvas:#06090f;--surface:#0b1018;--surface-2:#0f1724;--hair:rgba(255,255,255,.09);--hair-2:rgba(255,255,255,.15);--ink:#f3f6fb;--ink-2:#aeb9cc;--ink-3:#7b8799;--accent:#18d68f;--accent-ink:#04130d;--good:#18d68f;--low:#fb5a68;--sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--canvas);color:var(--ink);line-height:1.55;min-height:100vh;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:30px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em;margin-bottom:22px}
  .brand .mk{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
  h1{font-size:22px;letter-spacing:-.02em;margin-bottom:8px}
  p{color:var(--ink-2);font-size:14.5px;margin-bottom:18px}
  .status{display:flex;align-items:center;gap:10px;font-size:14px;padding:13px 15px;border-radius:10px;border:1px solid var(--hair);background:var(--surface-2);margin-bottom:18px}
  .status .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex-shrink:0}
  .status.ok .dot{background:var(--good)}
  .status.err .dot{background:var(--low)}
  .status.work .dot{background:var(--accent);animation:p 1s infinite}
  @keyframes p{0%,100%{opacity:.3}50%{opacity:1}}
  label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
  input{width:100%;background:var(--surface-2);border:1px solid var(--hair);border-radius:9px;color:var(--ink);font-family:var(--mono);font-size:14px;padding:12px 13px;outline:none;transition:border-color .15s}
  input:focus{border-color:var(--accent)}
  .btn{width:100%;margin-top:14px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:9px;font-family:inherit;font-weight:600;font-size:14.5px;padding:12px;cursor:pointer}
  .btn:hover{background:#28e69c}
  .btn:disabled{opacity:.55;cursor:default}
  .muted{font-size:12.5px;color:var(--ink-3);margin-top:16px}
  .muted a{color:var(--ink-2)}
  .sep{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--ink-3);font-family:var(--mono);font-size:11px}
  .sep::before,.sep::after{content:"";height:1px;background:var(--hair);flex:1}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="mk"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 5.6 18.4 10.3 16 17.8 8 17.8 5.6 10.3Z" stroke-width="1.7" stroke-linejoin="round"/><g fill="currentColor" stroke="none"><circle cx="12" cy="5.6" r="1.6"/><circle cx="18.4" cy="10.3" r="1.6"/><circle cx="16" cy="17.8" r="1.6"/><circle cx="8" cy="17.8" r="1.6"/><circle cx="5.6" cy="10.3" r="1.6"/><circle cx="12" cy="12" r="1.3"/></g></svg></span> CupIQ</div>
    <h1>Unlock CupIQ Pro</h1>
    <p id="lead">Confirming your purchase…</p>

    <div class="status work" id="status"><span class="dot"></span><span id="statusText">Checking…</span></div>

    <div id="keyForm" style="display:none">
      <div class="sep">or enter a license key</div>
      <label for="key">License key</label>
      <input id="key" placeholder="CUPIQ-XXXXXX-XXXXXXXXXXXX" autocomplete="off" spellcheck="false" />
      <button class="btn" id="keyBtn">Unlock access</button>
    </div>

    <div class="muted">Trouble? Email <a href="mailto:support@cupiq.app">support@cupiq.app</a> with your receipt.</div>
  </div>

<script>
  var PRO = "pro-k9x3f7q2a8.html";
  var statusEl = document.getElementById("status");
  var statusText = document.getElementById("statusText");
  var lead = document.getElementById("lead");
  var keyForm = document.getElementById("keyForm");

  function setStatus(state, text){ statusEl.className = "status " + state; statusText.textContent = text; }

  function unlock(payload, onFail){
    setStatus("work", "Verifying…");
    fetch("/api/unlock", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload) })
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok && j.ok, j:j }; }); })
      .then(function(res){
        if(res.ok){ setStatus("ok","Verified. Opening your dashboard…"); setTimeout(function(){ location.href = PRO; }, 700); }
        else { onFail(res.j && res.j.error); }
      })
      .catch(function(){ onFail("network"); });
  }

  function showKeyEntry(msg){
    lead.textContent = "Enter the license key from your receipt to unlock Pro.";
    setStatus("err", msg || "We couldn't confirm that automatically.");
    keyForm.style.display = "block";
  }

  // 1) If Stripe redirected here with a session id, verify it automatically.
  var sid = new URLSearchParams(location.search).get("session_id");
  if(sid){
    unlock({ sessionId: sid }, function(){ showKeyEntry("Couldn't confirm the payment automatically."); });
  } else {
    lead.textContent = "Enter the license key from your receipt to unlock Pro.";
    setStatus("", "Waiting for your license key.");
    keyForm.style.display = "block";
  }

  // 2) Manual key entry.
  document.getElementById("keyBtn").addEventListener("click", function(){
    var k = document.getElementById("key").value.trim();
    if(!k){ document.getElementById("key").focus(); return; }
    this.disabled = true;
    var btn = this;
    unlock({ key: k }, function(err){ btn.disabled = false; setStatus("err", err === "not_verified" ? "That key isn't valid." : "Something went wrong. Try again."); });
  });
  document.getElementById("key").addEventListener("keydown", function(e){ if(e.key === "Enter") document.getElementById("keyBtn").click(); });
</script>
<!-- consent + analytics (GA4 + Meta Pixel, load only after consent) -->
<div id="cookie-banner" class="cookie-banner" hidden role="dialog" aria-label="Cookie consent">
  <p>We use cookies for analytics (Google Analytics, Meta Pixel) to measure traffic and improve the site. See our <a href="privacy.html">Privacy Policy</a>.</p>
  <div class="cookie-actions"><button id="cookieDecline" class="cookie-btn ghost" type="button">Decline</button><button id="cookieAccept" class="cookie-btn" type="button">Accept</button></div>
</div>
<style>
  .cookie-banner{position:fixed;left:16px;right:16px;bottom:16px;max-width:580px;margin:0 auto;z-index:200;background:#0b1018;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:15px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 24px 60px -24px rgba(0,0,0,.85);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .cookie-banner p{color:#aeb9cc;font-size:13px;line-height:1.5;flex:1;min-width:230px;margin:0}
  .cookie-banner a{color:#18d68f;text-decoration:none}
  .cookie-actions{display:flex;gap:8px;margin-left:auto}
  .cookie-btn{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:9px;border:1px solid transparent;cursor:pointer;background:#18d68f;color:#04130d}
  .cookie-btn.ghost{background:transparent;border-color:rgba(255,255,255,.22);color:#f3f6fb}
  .cookie-btn:focus-visible{outline:2px solid #18d68f;outline-offset:2px}
</style>
<script>
(function(){
  /* ===== set your IDs (leave the placeholder text to keep that tool off) ===== */
  var GA_ID="G-XXXXXXXXXX";          /* Google Analytics 4 Measurement ID */
  var META_PIXEL_ID="METAPIXELID";   /* Meta (Facebook) Pixel ID */
  var KEY="cupiq_consent";
  var loaded=false;
  function loadAnalytics(){
    if(loaded) return; loaded=true;
    if(GA_ID.indexOf("X")<0){
      var s=document.createElement('script');s.async=true;s.src="https://www.googletagmanager.com/gtag/js?id="+GA_ID;document.head.appendChild(s);
      window.dataLayer=window.dataLayer||[];window.gtag=function(){window.dataLayer.push(arguments);};
      window.gtag('js',new Date());window.gtag('config',GA_ID);
    }
    if(/^\d+$/.test(META_PIXEL_ID)){
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
      window.fbq('init',META_PIXEL_ID);window.fbq('track','PageView');
    }
  }
  var banner=document.getElementById('cookie-banner');
  function choose(v){ try{localStorage.setItem(KEY,v);}catch(e){} if(banner)banner.hidden=true; if(v==='accept')loadAnalytics(); }
  var prior; try{prior=localStorage.getItem(KEY);}catch(e){}
  if(prior==='accept') loadAnalytics();
  else if(prior!=='decline' && banner) banner.hidden=false;
  var a=document.getElementById('cookieAccept'), d=document.getElementById('cookieDecline');
  if(a)a.addEventListener('click',function(){choose('accept');});
  if(d)d.addEventListener('click',function(){choose('decline');});
  /* fire a conversion event when a buy button is clicked (only if analytics consented/loaded) */
  document.addEventListener('click',function(e){
    var el=e.target.closest?e.target.closest('[data-cta]'):null; if(!el) return;
    var plan=el.getAttribute('data-cta'); if(plan==='free') return;
    if(window.fbq) window.fbq('track','InitiateCheckout',{content_name:plan});
    if(window.gtag) window.gtag('event','begin_checkout',{plan:plan});
  });
})();
</script>
</body>
</html>
